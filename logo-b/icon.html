<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:100%;height:100%}
  .tile{width:100vw;height:100vh;display:grid;place-items:center}
  .paper{background:radial-gradient(120% 120% at 30% 10%,#faf4e6 0%,#f1e8d2 60%,#e8dcc0 100%)}
  .green{background:linear-gradient(160deg,#44593b 0%,#364a2f 55%,#2e3f28 100%)}
  svg{width:76%;height:76%}
</style></head>
<body>
<div class="tile" id="t">
  <svg viewBox="0 0 200 200" fill="none" stroke="" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-44 100 100)">
      <path d="M84 158 C 54 116, 66 58, 110 36 C 144 60, 140 120, 102 152" stroke-width="4.8"/>
      <path d="M90 182 C 96 166, 99 138, 101 114 C 103 90, 107 70, 110 54" stroke-width="3.8"/>
    </g>
  </svg>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const variant = p.get('v') || 'paper';
  document.getElementById('t').className = 'tile ' + variant;
  document.querySelector('svg').setAttribute('stroke', variant === 'green' ? '#f4ecd9' : '#33472d');
</script>
</body></html>
